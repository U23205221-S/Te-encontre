server:
  port: 8080

spring:
  application:
    name: backend-java

  # ---------------------------------------------------------
  # CONFIGURACI�N DE BASE DE DATOS (Ajustado a tu log: qr_utp_db)
  # ---------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/qr_utp_db
    username: admin
    password: password123
    driver-class-name: org.postgresql.Driver

  # ---------------------------------------------------------
  # CONFIGURACI�N DE JPA E HIBERNATE
  # ---------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # 1. ELIMINA EL WARNING DE "open-in-view"
    # Se desactiva por rendimiento para evitar mantener la conexi�n abierta m�s tiempo de lo necesario.
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# ---------------------------------------------------------
# CONFIGURACI�N DE SPRINGDOC (SWAGGER)
# ---------------------------------------------------------
# 2 y 3. ELIMINAN LOS WARNINGS DE SPRINGDOC
# Define expl�citamente que quieres habilitar la documentaci�n y la UI.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ---------------------------------------------------------
# CONFIGURACI�N DE LOGS
# ---------------------------------------------------------
logging:
  level:
    root: INFO
    org.sync_astra.backendjava: DEBUG