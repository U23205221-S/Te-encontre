server:
  port: 8080
spring:
  application:
    name: backend-java

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  # ---------------------------------------------------------
  # CONFIGURACI�N DE BASE DE DATOS (Ajustado a tu log: qr_utp_db)
  # ---------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/qr_utp_db
    username: admin
    password: password123
    driver-class-name: org.postgresql.Driver

  # ---------------------------------------------------------
  # CONFIGURACI�N DE JPA E HIBERNATE
  # ---------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # 1. ELIMINA EL WARNING DE "open-in-view"
    # Se desactiva por rendimiento para evitar mantener la conexi�n abierta m�s tiempo de lo necesario.
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    mapper:
      default-view-inclusion: false

  # Configuración de Correo
  mail:
    host: smtp.gmail.com
    port: 587
    username: sync.astra0@gmail.com
    #Cambia esto por una contraseña de aplicación específica de Gmail, no uses tu contraseña real por seguridad
    password: pvpxzpqsvtcufzut
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true # Recomendado para mayor seguridad

  # Configuración de Hilos para mejorar el rendimiento en operaciones concurrentes
  threads:
    virtual:
      enabled: true
# ---------------------------------------------------------
# CONFIGURACI�N DE SPRINGDOC (SWAGGER)
# ---------------------------------------------------------
# 2 y 3. ELIMINAN LOS WARNINGS DE SPRINGDOC
# Define expl�citamente que quieres habilitar la documentaci�n y la UI.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ---------------------------------------------------------
# CONFIGURACI�N DE LOGS
# ---------------------------------------------------------
logging:
  level:
    root: INFO
    org.sync_astra.backendjava: DEBUG