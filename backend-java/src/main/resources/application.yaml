server:
  port: ${PORT:8080}

spring:
  application:
    name: backend-java
    security:
      jwt:
        # NUNCA hardcodear esto. En local tomará 'secret-local', en prod tomará el valor del servidor
        secret-key: ${JWT_SECRET_KEY:hX5vzZfwCq2wy4D6n9qPIy6Zu6C9Q8JbVfubhvEkYDX}
        expiration: ${JWT_EXPIRATION:86400000}
        refresh-token:
          expiration: ${JWT_REFRESH_EXPIRATION:604800000}



  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    # Usamos variables con valores por defecto apuntando a la BD local de Docker Compose
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qr_utp_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password123} # Esta default es solo para la BD local de prueba
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update} # En producción esto DEBE ser 'validate' o 'none'
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true


  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: INFO
    org.sync_astra.backendjava: ${LOG_LEVEL:DEBUG}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:tu-cloud-name}
  api-key: ${CLOUDINARY_API_KEY:tu-api-key}
  api-secret: ${CLOUDINARY_API_SECRET:tu-api-secret}

app:
  encryption:
    secret-key: ${ENCRYPTION_SECRET:tu-encryption-secret}
    algorithm: ${ENCRYPTION_ALGORITHM:AES}

resend:
    api-key: ${RESEND_API_KEY:tu-resend-api-key}
mi-api-cloud:
  token: ${MI_API_CLOUD_TOKEN:}
  url: ${MI_API_CLOUD_URL:}