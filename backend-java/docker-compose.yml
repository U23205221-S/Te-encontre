version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: postgres-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: qr_utp_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      # Volumen para que los datos no se borren si apagas el contenedor
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización (se ejecuta la primera vez)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  cache_redis_qr:
    image: redis:7.2-alpine
    container_name: social_network_redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data_volume:/data
volumes:
  postgres_data:
    name: postgres_data_volume
  redis_data_volume:
    name: redis_data_volume