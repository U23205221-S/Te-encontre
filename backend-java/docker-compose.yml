services:
  db:
    image: ankane/pgvector:latest
    container_name: postgres-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: qr_utp_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      # Volumen para que los datos no se borren si apagas el contenedor
      - postgres_qr_data_volume:/var/lib/postgresql/data
      # Script de inicialización (se ejecuta la primera vez)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  cache_redis_qr:
    image: redis:7.2-alpine
    container_name: cache_redis_qr
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_qr_data_volume:/data
    # NUEVO: Servidor de correos local para desarrollo

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit_dev
    ports:
      - "8025:8025" # Interfaz Web: http://localhost:8025 para ver los correos
      - "1025:1025" # Puerto SMTP: Donde Spring Boot enviará los correos
volumes:
  postgres_qr_data_volume:
    name: postgres_data_qr_volume
  redis_qr_data_volume:
    name: redis_data_qr_volume