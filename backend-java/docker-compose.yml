services:
  db:
    image: ankane/pgvector:latest
    container_name: postgres-pgvector
    ports:
      - "5432:5432"
    env_file:
      - .env # <-- ¡La BD ahora también lee de tu archivo seguro!
    volumes:
      # Volumen para que los datos no se borren si apagas el contenedor
      - postgres_qr_data_volume:/var/lib/postgresql/data
      # Script de inicialización (se ejecuta la primera vez)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  cache_redis_qr:
    image: redis:7.2-alpine
    container_name: cache_redis_qr
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_qr_data_volume:/data

  backend-java:
    build:
      context: .
      args:
        NAME_MICROSERVICE: backend-java
    ports:
      - "8080:8080"
    env_file:
      - .env  # Aquí Docker inyecta las variables del archivo que se pasan por privado
    depends_on:
      - db
      - cache_redis_qr

volumes:
  postgres_qr_data_volume:
    name: postgres_data_qr_volume
  redis_qr_data_volume:
    name: redis_data_qr_volume